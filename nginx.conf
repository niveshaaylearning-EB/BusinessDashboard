server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Reverse-proxy API calls to the backend container over Docker's internal
    # network (service name "backend", from docker-compose.yml) — so the
    # frontend and API share this one public URL/domain. No second public
    # domain, no VITE_API_URL, no CORS config needed for this to work: the
    # browser sees everything as same-origin. The trailing slashes on both
    # lines matter — nginx strips the /api/ prefix before forwarding, so
    # /api/auth/login here becomes /auth/login on the backend.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
