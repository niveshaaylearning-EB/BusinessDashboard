server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Reverse-proxy API calls to the backend container over Docker's internal
    # network (service name "backend", from docker-compose.yml) — so the
    # frontend and API share this one public URL/domain. No second public
    # domain, no VITE_API_URL, no CORS config needed for this to work: the
    # browser sees everything as same-origin. The trailing slashes on both
    # lines matter — nginx strips the /api/ prefix before forwarding, so
    # /api/auth/login here becomes /auth/login on the backend.
    #
    # The backend address is looked up per request through Docker's internal
    # DNS (127.0.0.11) instead of once at startup. A fixed address makes nginx
    # refuse to start ("host not found in upstream") whenever the backend
    # container isn't running yet or has crashed, taking the whole site down;
    # this way the site still loads and only /api calls fail (502) until the
    # backend is back.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
